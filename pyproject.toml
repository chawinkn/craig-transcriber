[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "transcribey"
version = "0.8.0"
description = "Turn multi-track or single-speaker audio into an accurate, speaker-labelled, reviewable transcript, entirely on your own computer."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = ["faster-whisper"]

[project.optional-dependencies]
gpu = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12==9.*"]
convert = ["ctranslate2", "transformers", "torch"]
dev = ["ruff==0.17.1"]

[project.scripts]
transcribey = "transcribey.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
transcribey = ["static/*"]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = [".venv", "transcribey_work", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.isort]
known-first-party = ["transcribey"]
